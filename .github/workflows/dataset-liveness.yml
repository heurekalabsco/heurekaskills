name: Dataset liveness

# Every skill's `## Try it` declares the data it runs against in `datasets:` frontmatter.
# Those decay on their own schedule — URLs 404, accessions are withdrawn, hosts add a login
# — independently of whether the tool the skill documents changed at all.
#
# Runs at 07:00 UTC, an hour ahead of the nightshift, so the routine starts from a fresh
# result. The routine also runs this script itself; this schedule exists so a dead dataset
# is still recorded on a night the routine never starts.
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'skills/**/SKILL.md'
      - 'scripts/check-datasets.js'
      - 'scripts/lib.js'
      - '.github/workflows/dataset-liveness.yml'

# This job fetches URLs supplied by contributors, so give it the least it can run on.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Probe every declared dataset
        run: node scripts/check-datasets.js

  # A red X in the Actions tab is not a notification — logs expire and nobody watches. File
  # it where the backlog already lives. Scheduled runs only: a failing PR check is already
  # visible on the PR itself.
  notify:
    needs: check
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = 'Dataset liveness check is failing';
            const body = [
              'The nightly dataset liveness check failed. A skill now points readers at data they cannot fetch.',
              '',
              `Run: ${url}`,
              '',
              'Reproduce locally with `npm run check-datasets`. Fix by pointing the skill at another public',
              'dataset (say in the PR that you substituted it and why), or — if none exists — falling back to',
              'an inline generator and stating plainly that the real dataset is gone. Never swap in synthetic',
              'data quietly to make this go green; that turns a visible failure into a silent one.',
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'dataset-liveness',
            });
            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Still failing as of ${new Date().toISOString().slice(0, 10)} — ${url}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['dataset-liveness'],
              });
            }
