name: Dataset liveness

# Every skill's `## Try it` declares the data it runs against in `datasets:` frontmatter.
# Those decay on their own schedule — URLs 404, accessions are withdrawn, hosts add a login
# — independently of whether the tool the skill documents changed at all.
#
# Runs at 07:00 UTC, an hour ahead of the nightshift, so the routine starts from a fresh
# result. The routine also runs this script itself; this schedule exists so a dead dataset
# is still recorded on a night the routine never starts.
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      selftest:
        description: 'Prove an alarm branch still fires, against a fixture rather than a real outage'
        type: choice
        options: ['none', 'dataset', 'publish']
        default: 'none'
  pull_request:
    paths:
      - 'skills/**/SKILL.md'
      - 'scripts/check-datasets.js'
      - 'scripts/check-published.js'
      - 'scripts/lib.js'
      - '.github/workflows/dataset-liveness.yml'

# This job fetches URLs supplied by contributors, so give it the least it can run on.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      publish_failed: ${{ steps.published.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Runs first and on every trigger, because it needs no network: it is the one check here
      # that can fail for a reason inside this repo. The corroborator's set logic shipped with
      # four bugs that an audit found and that any one run of this would have caught — including
      # one that reported the inverse of the truth, and one where two identically-broken networks
      # confirmed each other's false deaths.
      - name: Selftest the corroborator
        run: ./scripts/corroborate-selftest.sh

      - name: Probe every declared dataset
        id: datasets
        if: inputs.selftest != 'dataset' && inputs.selftest != 'publish'
        continue-on-error: true
        # --json-out writes the machine-readable report alongside the human log, in ONE pass.
        # Probing 220 datasets twice to get both would be slow and discourteous to the hosts.
        run: node scripts/check-datasets.js --json-out /tmp/ci-liveness.json

      - name: Keep the report for corroboration
        # Matches line 46's negative form, and that is load-bearing. `inputs` is only populated
        # for workflow_dispatch, and dispatch defaults are NOT applied to other events — so on a
        # schedule run `inputs.selftest` is null and `== 'none'` is FALSE. Written that way, this
        # step skipped on every scheduled run, which is the only trigger publish-report accepts:
        # the upload and its consumer were mutually exclusive and the feature never ran once.
        if: always() && inputs.selftest != 'dataset' && inputs.selftest != 'publish'
        uses: actions/upload-artifact@v4
        with:
          name: ci-liveness-report
          path: /tmp/ci-liveness.json
          retention-days: 7
          if-no-files-found: warn

      # An alarm nobody has watched fire is not known to work. Each branch points a script at
      # the same fixture, so a dispatch can prove the notify job opens the RIGHT issue —
      # without waiting for a real dataset to rot or a real deploy to break. `selftest: publish`
      # exercises the branch added with the publish check; `selftest: dataset` the original.
      - name: Self-test — prove the alarm fires
        if: inputs.selftest == 'dataset'
        run: SKILLS_DIR=.github/fixtures/dataset-selftest/skills node scripts/check-datasets.js

      # Merging is not publishing. Every link after the merge — dispatch, site build, deploy,
      # CDN — is invisible from this repo, and when that chain broke for two days nothing here
      # noticed: the dispatch job reported success because sending the dispatch is all it does.
      # This asks the only question that matters to a reader: can they install what we merged.
      #
      # Both probes run to completion before anything fails, so a dead dataset cannot mask a
      # stale registry. They are independent outages with different owners — one is a skill
      # pointing at data that moved, the other is a broken deploy in another repo — and
      # discovering the second only after fixing the first would waste a night.
      # Scheduled runs only. This is a POST-merge assertion: a skill in an open PR is not
      # published yet, by definition, so running it on `pull_request` would fail every
      # skill-adding PR — turning this alarm red on exactly the workflow the registry exists
      # to process, and training everyone to ignore it. A false red that frequent is worse
      # than no alarm, because it takes the real one down with it.
      - name: Published registry matches this repo
        id: published
        if: (inputs.selftest == 'publish' || (inputs.selftest != 'dataset' && github.event_name != 'pull_request'))
        continue-on-error: true
        env:
          # The dataset fixture works unchanged here: one skill that is not in the registry is
          # exactly the shape of the real outage. SKILLS_DIR='' is falsy, so a normal run falls
          # back to the real skills/ and the script needs no self-test branch of its own.
          SKILLS_DIR: ${{ inputs.selftest == 'publish' && '.github/fixtures/dataset-selftest/skills' || '' }}
        run: node scripts/check-published.js

      # One gate for both, so each probe's outcome survives for the notify job to read. Without
      # this the alarm would file a dataset issue for a publish outage and send somebody to
      # swap a dataset that is perfectly healthy.
      - name: Fail if either probe failed
        if: steps.datasets.outcome == 'failure' || steps.published.outcome == 'failure'
        run: |
          echo "datasets: ${{ steps.datasets.outcome }}   published: ${{ steps.published.outcome }}"
          exit 1

  # This vantage's result, published where the nightshift can read it an hour later.
  #
  # A dataset is dead only when two independent networks agree it is. This runner and the
  # routine's sandbox fail in OPPOSITE directions — on 2026-09-28 this one read All of Us as
  # newly gated (a datacenter interstitial; a laptop got 200 JSON) while the sandbox read
  # HuggingFace's Xet CDN as dead (a hop it has no route to). Neither is entitled to a verdict
  # alone, and the disagreement is the most useful signal either produces. The rule and its
  # rationale are maintained with the rest of the nightshift machinery, outside this repo.
  #
  # Runs on success too, and that is the point: "we reached everything" is exactly the evidence
  # that downgrades the other vantage's dead result. Publishing only on failure would corroborate
  # nothing.
  publish-report:
    needs: check
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ci-liveness-report
          path: /tmp/report
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '/tmp/report/ci-liveness.json';
            if (!fs.existsSync(path)) {
              core.warning('no report artifact — the probe step did not produce one; publishing nothing rather than an empty report that would read as "this vantage reached everything"');
              return;
            }
            const r = JSON.parse(fs.readFileSync(path, 'utf8'));
            // Only what corroboration needs. The full report is the artifact; this is a
            // durable, readable summary that does not expire in seven days.
            const slim = {
              vantage: 'github-actions/ubuntu-latest',
              checkedAt: r.checkedAt,
              skills: r.skills,
              datasets: r.datasets,
              dead: (r.dead || []).map(({ slug, url, status, reason, via }) => ({ slug, url, status, reason, via })),
              inconclusive: (r.inconclusive || []).map(({ slug, url, status }) => ({ slug, url, status })),
            };
            const body = [
              '<!-- ci-liveness v1 — replaced on every scheduled run; do not edit by hand -->',
              'The GitHub Actions vantage, published so the nightshift can corroborate against it.',
              '**A dataset is dead only when this report and the sweep agree** — neither vantage is entitled to a verdict alone.',
              '',
              `Checked **${slim.checkedAt}** — ${slim.datasets} datasets across ${slim.skills} skills · ${slim.dead.length} dead here · ${slim.inconclusive.length} inconclusive here.`,
              '',
              '```json',
              JSON.stringify(slim, null, 2),
              '```',
            ].join('\n');
            const title = 'CI dataset-liveness report (machine-readable, replaced each run)';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'ci-liveness-report',
            });
            if (existing.data.length) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['ci-liveness-report'],
              });
            }

  # A red X in the Actions tab is not a notification — logs expire and nobody watches. File
  # it where the backlog already lives. Scheduled runs only: a failing PR check is already
  # visible on the PR itself.
  notify:
    needs: check
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const publishFailed = '${{ needs.check.outputs.publish_failed }}' === 'true';
            const title = publishFailed
              ? 'Merged skills are not reaching the published registry'
              : 'Dataset liveness check is failing';
            const body = publishFailed ? [
              'The published registry does not match this repository. Skills that were reviewed and',
              'merged are not installable — readers get the old set.',
              '',
              `Run: ${url}`,
              '',
              'This is almost never a problem in this repo. Merging fires a dispatch, the site rebuilds,',
              'and the deploy publishes; any link in that chain can break while this repo looks healthy.',
              'Check the site repository\'s most recent deploy first — that is where it has broken before',
              '(ten consecutive runs refused at startup, silently, for two days).',
              '',
              'Reproduce locally with `npm run check-published`.',
            ].join('\n') : [
              'The nightly dataset liveness check failed. A skill now points readers at data they cannot fetch.',
              '',
              `Run: ${url}`,
              '',
              'Reproduce locally with `npm run check-datasets`. Fix by pointing the skill at another public',
              'dataset (say in the PR that you substituted it and why), or — if none exists — falling back to',
              'an inline generator and stating plainly that the real dataset is gone. Never swap in synthetic',
              'data quietly to make this go green; that turns a visible failure into a silent one.',
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: publishFailed ? 'publish-liveness' : 'dataset-liveness',
            });
            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Still failing as of ${new Date().toISOString().slice(0, 10)} — ${url}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: [publishFailed ? 'publish-liveness' : 'dataset-liveness'],
              });
            }
