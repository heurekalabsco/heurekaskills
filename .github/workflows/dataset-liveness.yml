name: Dataset liveness

# Every skill's `## Try it` declares the data it runs against in `datasets:` frontmatter.
# Those decay on their own schedule — URLs 404, accessions are withdrawn, hosts add a login
# — independently of whether the tool the skill documents changed at all.
#
# Runs at 07:00 UTC, an hour ahead of the nightshift, so the routine starts from a fresh
# result. The routine also runs this script itself; this schedule exists so a dead dataset
# is still recorded on a night the routine never starts.
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      selftest:
        description: 'Run against a fixture with a known-dead dataset, to prove the notify path still fires'
        type: boolean
        default: false
  pull_request:
    paths:
      - 'skills/**/SKILL.md'
      - 'scripts/check-datasets.js'
      - 'scripts/lib.js'
      - '.github/workflows/dataset-liveness.yml'

# This job fetches URLs supplied by contributors, so give it the least it can run on.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      publish_failed: ${{ steps.published.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Probe every declared dataset
        if: inputs.selftest != true
        run: node scripts/check-datasets.js

      # An alarm nobody has watched fire is not known to work. This points the same script
      # at a fixture declaring one unreachable dataset, so a dispatch can prove the notify
      # job still opens an issue — without waiting for a real dataset to rot.
      - name: Self-test — prove the alarm fires
        if: inputs.selftest == true
        run: SKILLS_DIR=.github/fixtures/dataset-selftest/skills node scripts/check-datasets.js

      # Merging is not publishing. Every link after the merge — dispatch, site build, deploy,
      # CDN — is invisible from this repo, and when that chain broke for two days nothing here
      # noticed: the dispatch job reported success because sending the dispatch is all it does.
      # This asks the only question that matters to a reader: can they install what we merged.
      # Runs after the dataset probe so a dead dataset and a stale registry report separately.
      - name: Published registry matches this repo
        id: published
        if: inputs.selftest != true
        continue-on-error: true
        run: node scripts/check-published.js

      # Gate separately so the job still fails, while `published.outcome` survives for the
      # notify job below. Without this the alarm would file a dataset issue for a publish
      # outage and send somebody to swap a dataset that is perfectly healthy.
      - name: Fail if the published registry is stale
        if: steps.published.outcome == 'failure'
        run: exit 1

  # A red X in the Actions tab is not a notification — logs expire and nobody watches. File
  # it where the backlog already lives. Scheduled runs only: a failing PR check is already
  # visible on the PR itself.
  notify:
    needs: check
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const publishFailed = '${{ needs.check.outputs.publish_failed }}' === 'true';
            const title = publishFailed
              ? 'Merged skills are not reaching the published registry'
              : 'Dataset liveness check is failing';
            const body = publishFailed ? [
              'The published registry does not match this repository. Skills that were reviewed and',
              'merged are not installable — readers get the old set.',
              '',
              `Run: ${url}`,
              '',
              'This is almost never a problem in this repo. Merging fires a dispatch, the site rebuilds,',
              'and the deploy publishes; any link in that chain can break while this repo looks healthy.',
              'Check the site repository\'s most recent deploy first — that is where it has broken before',
              '(ten consecutive runs refused at startup, silently, for two days).',
              '',
              'Reproduce locally with `npm run check-published`.',
            ].join('\n') : [
              'The nightly dataset liveness check failed. A skill now points readers at data they cannot fetch.',
              '',
              `Run: ${url}`,
              '',
              'Reproduce locally with `npm run check-datasets`. Fix by pointing the skill at another public',
              'dataset (say in the PR that you substituted it and why), or — if none exists — falling back to',
              'an inline generator and stating plainly that the real dataset is gone. Never swap in synthetic',
              'data quietly to make this go green; that turns a visible failure into a silent one.',
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: publishFailed ? 'publish-liveness' : 'dataset-liveness',
            });
            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Still failing as of ${new Date().toISOString().slice(0, 10)} — ${url}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: [publishFailed ? 'publish-liveness' : 'dataset-liveness'],
              });
            }
